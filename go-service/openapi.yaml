openapi: 3.1.0
info:
  title: Modd Hosting Controller API
  version: 1.0.0
  license:
    name: MIT
    identifier: MIT
servers:
  - url: https://controller.example:8443
    description: Public Caddy endpoint; Caddy proxies to the controller over HTTP
security:
  - bearerAuth: []
paths:
  /v1/health:
    get:
      summary: Check daemon liveness
      security: []
      operationId: health
      responses:
        "200":
          description: Daemon is serving requests
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: ok }
                required: [status]
        "400": { $ref: "#/components/responses/Error" }
  /v1/info:
    get:
      summary: Get controller build and configuration information
      operationId: info
      responses:
        "200": { $ref: "#/components/responses/JSONObject" }
        "401": { $ref: "#/components/responses/Error" }
  /v1/image/versions:
    get:
      summary: List locally available image versions
      operationId: imageVersions
      responses:
        "200":
          description: Locally available versions from the configured repository
          content:
            application/json:
              schema:
                type: object
                properties:
                  versions:
                    type: array
                    items: { $ref: "#/components/schemas/ImageVersion" }
                required: [versions]
        "401": { $ref: "#/components/responses/Error" }
  /v1/image/pull:
    post:
      summary: Pull an image from Docker Hub
      description: An empty version resolves and pulls the most recently pushed tag starting with v.
      operationId: pullImage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                version: { type: string, description: Exact tag to pull; empty selects the latest v tag }
              required: [version]
            example: { version: pr-123 }
      responses:
        "202":
          description: Image pull queued; completion or failure is written to the controller log
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: queued }
                  version: { type: string }
                required: [status, version]
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /v1/services:
    get:
      summary: List services and observed status
      operationId: listServices
      responses:
        "200":
          description: Non-deleted services
          content:
            application/json:
              schema:
                type: object
                properties:
                  services:
                    type: array
                    items: { $ref: "#/components/schemas/ServiceStatus" }
                required: [services]
        "401": { $ref: "#/components/responses/Error" }
  /v1/services/{id}:
    parameters:
      - $ref: "#/components/parameters/ServiceID"
    get:
      summary: Get one service and observed status
      operationId: getService
      responses:
        "200":
          description: Desired and observed service status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceStatus" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      summary: Provision or reconcile a service
      description: Existing active services reconcile domains and image version; suspended services reconcile domains only.
      operationId: provisionService
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProvisionRequest" }
            example:
              main_domain: mysite.com
              public_ipv4: 203.0.113.10
              version: v21.6.24
              display_name: My site
      responses:
        "200": { description: Provisioning already matches or hostname reconciliation completed, content: { application/json: { schema: { $ref: "#/components/schemas/ActionResult" } } } }
        "202": { description: Provisioning or upgrade started; health and routing continue asynchronously, content: { application/json: { schema: { $ref: "#/components/schemas/ActionResult" } } } }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      summary: Permanently delete a terminated service
      operationId: deleteService
      responses:
        "200": { description: Deletion already complete, content: { application/json: { schema: { $ref: "#/components/schemas/ActionResult" } } } }
        "202": { description: Resources removed; routing cleanup continues, content: { application/json: { schema: { $ref: "#/components/schemas/ActionResult" } } } }
        "409": { $ref: "#/components/responses/Error" }
  /v1/services/{id}/suspend:
    post:
      summary: Suspend an active service
      operationId: suspendService
      parameters: [{ $ref: "#/components/parameters/ServiceID" }]
      responses:
        "200": { $ref: "#/components/responses/ServiceStatus" }
        "202": { $ref: "#/components/responses/ServiceStatus" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/services/{id}/resume:
    post:
      summary: Resume a suspended or terminated service
      operationId: resumeService
      parameters: [{ $ref: "#/components/parameters/ServiceID" }]
      responses:
        "200": { $ref: "#/components/responses/ServiceStatus" }
        "202": { $ref: "#/components/responses/ServiceStatus" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /v1/services/{id}/terminate:
    post:
      summary: Terminate a service while preserving data
      operationId: terminateService
      parameters: [{ $ref: "#/components/parameters/ServiceID" }]
      responses:
        "200": { $ref: "#/components/responses/ServiceStatus" }
        "202": { $ref: "#/components/responses/ServiceStatus" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/services/{id}/upgrade:
    post:
      summary: Deploy an image version using blue-green switching
      operationId: upgradeService
      parameters: [{ $ref: "#/components/parameters/ServiceID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpgradeRequest" }
            example:
              version: v21.6.24
              confirm_downgrade: true
      responses:
        "200": { $ref: "#/components/responses/ServiceStatus" }
        "202": { $ref: "#/components/responses/ServiceStatus" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /v1/services/{id}/monitor-token:
    post:
      summary: Create a one-hour read-only browser monitor token
      operationId: createMonitorToken
      parameters: [{ $ref: "#/components/parameters/ServiceID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties: { origin: { type: string, format: uri } }
              required: [origin]
      responses:
        "200":
          description: HMAC token scoped to the service and WHMCS origin
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  expires_at: { type: string, format: date-time }
                required: [token, expires_at]
        "401": { $ref: "#/components/responses/Error" }
  /v1/services/{id}/status/ws:
    get:
      summary: Monitor current service status over WebSocket
      description: Pass `modd-monitor` and the monitor token as Sec-WebSocket-Protocol values. The browser Origin must match the token. A full StatusSnapshot is sent immediately and thereafter only when state changes, at one-second observation intervals. The final deleted snapshot is followed by a normal close.
      operationId: monitorServiceStatus
      security: []
      parameters: [{ $ref: "#/components/parameters/ServiceID" }]
      responses:
        "101": { description: WebSocket upgrade; messages use the StatusSnapshot schema }
        "401": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    ServiceID:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: '^whmcs-[1-9][0-9]*$'
  schemas:
    ProvisionRequest:
      type: object
      additionalProperties: false
      properties:
        main_domain: { type: string, format: hostname }
        staging_domain: { type: string, format: hostname }
        public_ipv4: { type: string, format: ipv4 }
        version: { type: string, minLength: 1 }
        display_name: { type: string }
      required: [main_domain, public_ipv4, version]
    UpgradeRequest:
      type: object
      additionalProperties: false
      properties:
        version: { type: string, minLength: 1 }
        confirm_downgrade: { type: boolean, default: false }
      required: [version]
    ImageVersion:
      type: object
      properties:
        version: { type: string }
        image_reference: { type: string }
        local: { type: boolean }
        created_at: { type: string, format: date-time }
      required: [version, image_reference, local]
    ServiceStatus:
      type: object
      properties:
        id: { type: string }
        state: { type: string, enum: [active, suspended, terminated, deleted] }
        main_domain: { type: string }
        staging_domain: { type: string }
        public_ipv4: { type: string, format: ipv4 }
        version: { type: string }
        live_deploy: { type: string, enum: [blue, green] }
        phase: { type: string, enum: [provisioning, starting, waiting_for_health, routing, draining, running, stopping, stopped, deleting, deleted, failed] }
        operation: { type: string, enum: [provision, resume, suspend, terminate, upgrade, delete] }
        target_deploy: { type: string, enum: [blue, green] }
        target_version: { type: string }
        target_main_domain: { type: string, format: hostname }
        target_staging_domain: { type: string, format: hostname }
        target_public_ipv4: { type: string, format: ipv4 }
        dns_status: { type: string, enum: [pending, in_sync, error] }
        dns_last_error: { type: string }
        dns_synced_at: { type: string, format: date-time }
        message: { type: string }
        deployments:
          type: object
          properties:
            blue: { $ref: "#/components/schemas/DeploymentStatus" }
            green: { $ref: "#/components/schemas/DeploymentStatus" }
        dataset_exists: { type: boolean }
        dataset_used_bytes: { type: integer, minimum: 0 }
        containers: { type: array, items: { type: object } }
        metrics: { type: object }
        warnings: { type: array, items: { type: string } }
      required: [id, state, phase, main_domain, staging_domain, public_ipv4, version, live_deploy, message, deployments, warnings]
    DeploymentStatus:
      type: object
      properties:
        version: { type: string }
        runtime: { type: string, enum: [absent, stopped, running] }
        health: { type: string, enum: [unknown, checking, healthy, unhealthy] }
        receives_traffic: { type: boolean }
      required: [runtime, health, receives_traffic]
    ActionResult:
      type: object
      properties:
        service:
          oneOf:
            - { $ref: "#/components/schemas/ServiceStatus" }
            - { $ref: "#/components/schemas/TombstoneStatus" }
      required: [service]
    TombstoneStatus:
      type: object
      properties:
        id: { type: string }
        state: { type: string, const: deleted }
        phase: { type: string, enum: [deleting, deleted, failed] }
        operation: { type: string, enum: [delete] }
        updated_at: { type: string, format: date-time }
      required: [id, state, phase, updated_at]
    MonitorServiceStatus:
      type: object
      properties:
        id: { type: string }
        state: { type: string, enum: [active, suspended, terminated, deleted] }
        phase: { type: string, enum: [provisioning, starting, waiting_for_health, routing, draining, running, stopping, stopped, deleting, deleted, failed] }
        operation: { type: string, enum: [provision, resume, suspend, terminate, upgrade, delete] }
        live_deploy: { type: string, enum: [blue, green] }
        target_deploy: { type: string, enum: [blue, green] }
        target_version: { type: string }
        dns_status: { type: string, enum: [pending, in_sync, error] }
        dns_last_error: { type: string }
        dns_synced_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        message: { type: string }
        deployments:
          type: object
          additionalProperties: { $ref: "#/components/schemas/DeploymentStatus" }
      required: [id, state, phase, updated_at, message, deployments]
    StatusSnapshot:
      type: object
      properties:
        type: { type: string, const: status }
        observed_at: { type: string, format: date-time }
        service: { $ref: "#/components/schemas/MonitorServiceStatus" }
      required: [type, observed_at, service]
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            request_id: { type: string }
          required: [code, message, request_id]
      required: [error]
  responses:
    ServiceStatus:
      description: Service status
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ActionResult" }
    Error:
      description: Structured error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    JSONObject:
      description: JSON response
      content:
        application/json:
          schema: { type: object }
