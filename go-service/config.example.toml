[server]
listen = "127.0.0.1:8443"
request_timeout = "120s"
shutdown_timeout = "15s"

[auth]
bearer_token_file = "/etc/modd-hosting/api-token"

[zfs]
dataset_prefix = "tank/modd/sites"
mount_prefix = "/modd/sites"

[state]
services_dir = "/var/lib/modd-hosting/services"
tombstones_dir = "/var/lib/modd-hosting/tombstones"

[caddy]
service_config_dir = "/var/lib/modd-hosting/caddy/services"
suspension_root = "/srv/modd-suspended"
active_template = """
{domain} {
  reverse_proxy unix//run/whmcs/{service_id}-{slot}/http.sock
}
"""
validate_command = ["docker", "exec", "caddy", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
reload_command = ["docker", "exec", "caddy", "caddy", "reload", "--config", "/etc/caddy/Caddyfile"]

[docker]
network = "udo-net"
image_repository = "whmcs-runtime"
pull_timeout = "30m"
binds = [
  "{mountpoint}/site:/srv/modd/site",
  "{mountpoint}/backup:/srv/modd/backup",
  "{mountpoint}/{slot}/cache:/srv/modd/cache",
]
environment = []

[certificates]
root_certificate = "/etc/modd-hosting/certificates/root.crt"
intermediate_certificate = "/etc/modd-hosting/certificates/intermediate.crt"
intermediate_key = "/etc/modd-hosting/certificates/intermediate.key"
mount_path = "/srv/modd/secrets"

[deployment]
health_path = "/~/health/check"
health_attempts = 30
health_initial_delay = "3s"
health_backoff_increment = "2s"
traffic_drain = "10s"
socket = "/run/whmcs/{service_id}-{slot}/http.sock"

[domains]
staging_suffix = "staging.com"

# Omit this section to disable DNS updates.
[dns]
endpoint = "https://whmcs.example/modules/addons/whmcs_dns/dns.php"
key_file = "/etc/modd-hosting/whmcs-dns-key"

[google_chat]
webhook_url_file = "/etc/modd-hosting/google-chat-url"
